<style>
:root{
  --bg:#FAFAFF;--bg-2:#F2F3FF;--surface:#FFFFFF;--surface-2:#F7F8FF;
  --ink:#0F1226;--ink-2:#464B67;--ink-3:#5F6485;
  --accent:#4F46E5;--accent-hi:#6366F1;--accent-deep:#3730A3;--accent-soft:rgba(79,70,229,.1);--accent-ink:#FFFFFF;
  --violet:#7C3AED;--cyan:#06B6D4;
  --ok:#047857;--err:#DC2626;--wa:#0E7C6B;
  --line:rgba(15,18,38,.08);--line-2:rgba(15,18,38,.16);
  --shadow:0 30px 60px -28px rgba(37,32,120,.38);--shadow-sm:0 12px 26px -16px rgba(37,32,120,.3);
  --radius:16px;--radius-lg:28px;--max:1200px;--gutter:clamp(16px,4vw,32px);--nav-h:72px;
  --font-display:"Sora",system-ui,sans-serif;--font-body:"DM Sans",system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--nav-h) + 12px)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:clip}
img,svg,canvas{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.1;letter-spacing:-.02em}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:3px solid var(--accent-hi);outline-offset:3px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.wrap{width:min(100% - var(--gutter)*2,var(--max));margin-inline:auto}
.skip{position:fixed;left:16px;top:-80px;z-index:200;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:10px;font-weight:600;transition:top .2s}
.skip:focus{top:16px}
.ic{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;background:linear-gradient(90deg,var(--accent),var(--violet),var(--cyan));transform-origin:0 50%;transform:scaleX(var(--sp,0));pointer-events:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;font:600 .98rem var(--font-display);border:1px solid transparent;transition:transform .3s var(--ease),background .25s,box-shadow .3s,border-color .25s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.65;cursor:not-allowed}
.btn-sm{min-height:44px;padding:0 18px;font-size:.9rem}
.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 14px 28px -14px var(--accent)}
.btn-primary:hover{background:var(--accent-deep);transform:translateY(-2px)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line-2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent-deep);transform:translateY(-2px)}
.btn-wa{background:var(--wa);color:var(--accent-ink)}
.btn-wa:hover{transform:translateY(-2px);box-shadow:0 14px 28px -16px var(--wa)}
.btn .ic{transition:transform .3s var(--ease)}
.btn:hover .ic-go{transform:translateX(4px)}

.nav{position:fixed;inset:0 0 auto 0;z-index:80;height:var(--nav-h);display:flex;align-items:center;transition:background .3s,box-shadow .3s,backdrop-filter .3s}
.nav.solid{background:color-mix(in srgb,var(--bg) 84%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 1px 0 var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:inline-flex;align-items:center;gap:10px;font:700 1.15rem var(--font-display);letter-spacing:-.02em;min-height:44px}
.logo-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--violet));color:var(--accent-ink);box-shadow:0 8px 18px -8px var(--accent)}
.nav-links{display:flex;gap:6px}
.nav-links a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:999px;font-weight:500;color:var(--ink-2);transition:color .2s,background .2s}
.nav-links a:hover{color:var(--ink);background:var(--accent-soft)}
.nav-right{display:flex;align-items:center;gap:10px}
.burger{display:none;width:44px;height:44px;border-radius:12px;place-items:center;border:1px solid var(--line-2);background:var(--surface)}
.mnav{position:fixed;inset:var(--nav-h) 0 auto 0;z-index:79;padding:12px var(--gutter) 24px;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow);display:grid;gap:4px;animation:drop .3s var(--ease)}
.mnav[hidden]{display:none}
.mnav a{display:flex;align-items:center;min-height:48px;padding:0 8px;font:600 1.05rem var(--font-display);border-bottom:1px solid var(--line)}
.mnav .btn{margin-top:14px;border:0}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}}

.hero{position:relative;min-height:100svh;display:flex;align-items:center;padding:calc(var(--nav-h) + 24px) 0 72px;overflow:hidden;isolation:isolate}
.hero-bg{position:absolute;inset:0;z-index:-4;background:radial-gradient(55% 60% at 80% 28%,var(--accent-soft),transparent 72%),radial-gradient(40% 45% at 95% 85%,color-mix(in srgb,var(--cyan) 14%,transparent),transparent 70%),radial-gradient(35% 40% at 5% 95%,color-mix(in srgb,var(--violet) 10%,transparent),transparent 70%)}
.hero-dots{position:absolute;inset:0;z-index:-3;background-image:radial-gradient(var(--line-2) 1px,transparent 1.5px);background-size:30px 30px;-webkit-mask-image:radial-gradient(70% 75% at 72% 40%,black,transparent);mask-image:radial-gradient(70% 75% at 72% 40%,black,transparent)}
#field{position:absolute;inset:0;width:100%;height:100%;z-index:-2;opacity:0;transition:opacity 1.4s ease}
.field-on #field{opacity:1}
.hero-scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 78%,transparent) 34%,transparent 66%);pointer-events:none}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:10px;min-height:36px;padding:0 16px 0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);font:600 .88rem var(--font-body);color:var(--ink-2);box-shadow:var(--shadow-sm)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:ping 2.2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.h1{font-size:clamp(2.55rem,6.1vw,5.3rem);font-weight:700;line-height:1.03;letter-spacing:-.04em;margin:22px 0 22px}
.h1 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.14em;margin-bottom:-.14em}
.h1 .w>span{display:inline-block;transform:translateY(108%);animation:rise 1s var(--ease) forwards;animation-delay:calc(var(--i)*80ms + 120ms)}
@keyframes rise{to{transform:none}}
.grad{background:linear-gradient(100deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-sub{font-size:clamp(1.05rem,1.6vw,1.25rem);color:var(--ink-2);max-width:54ch}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.facts{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:30px;color:var(--ink-2);font-weight:500;font-size:.95rem}
.facts li{display:inline-flex;align-items:center;gap:8px}
.facts .ic{color:var(--ok)}

.stage{perspective:1400px;display:grid;place-items:center;min-height:460px}
.deck{position:relative;width:min(100%,470px);aspect-ratio:1/1.04;transform-style:preserve-3d;transform:rotateX(var(--rx,6deg)) rotateY(var(--ry,-14deg));transition:transform .3s ease-out}
.dcard{position:absolute;border-radius:var(--radius-lg);background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow)}
.dc-main{inset:2% 0 16% 0;padding:20px;transform:translateZ(0);animation:bob 7s ease-in-out infinite}
.dc-flow{right:-5%;bottom:0;width:60%;padding:14px 16px;transform:translateZ(80px);animation:bob 6s ease-in-out -2s infinite}
.dc-chip{left:-7%;top:40%;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font:600 .88rem var(--font-body);transform:translateZ(120px);animation:bob 5.5s ease-in-out -1s infinite}
.dc-chip .ic{color:var(--violet)}
.dc-chip2{right:6%;top:-5%;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font:600 .88rem var(--font-body);transform:translateZ(60px);animation:bob 6.5s ease-in-out -3s infinite}
.dc-chip2 .ic{color:var(--ok)}
@keyframes bob{50%{translate:0 -12px}}
.win-dots{display:flex;gap:6px;margin-bottom:16px}
.win-dots i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.win-dots i:nth-child(1){background:var(--err)}
.win-dots i:nth-child(2){background:var(--cyan)}
.win-dots i:nth-child(3){background:var(--ok)}
.bubble{padding:14px 16px;border-radius:16px 16px 4px 16px;background:var(--accent);color:var(--accent-ink);font-size:.94rem;min-height:3.4em;margin-left:14%}
.caret{display:inline-block;width:2px;height:1em;background:currentColor;vertical-align:-.15em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.reply{margin-top:14px;padding:14px 16px;border-radius:16px 16px 16px 4px;background:var(--surface-2);border:1px solid var(--line);margin-right:10%;display:grid;gap:8px;min-height:7.2em}
.reply .ln{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;color:var(--ink-2);opacity:0;transform:translateY(6px);animation:lnin .5s var(--ease) forwards;animation-delay:calc(var(--k)*180ms)}
.reply .ln .ic{color:var(--ok);margin-top:.2em}
@keyframes lnin{to{opacity:1;transform:none}}
.flow-title{font:600 .78rem var(--font-body);color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.flow-svg{width:100%;height:auto}
.flow-line{stroke:var(--accent-hi);stroke-width:2;fill:none;stroke-dasharray:5 6;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
.flow-node{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.flow-node.hot{fill:var(--accent)}

.marquee{overflow:hidden;border-block:1px solid var(--line);background:var(--surface);padding:18px 0}
.marquee-label{text-align:center;font:600 .78rem var(--font-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:14px}
.track{display:flex;width:max-content;animation:slide 38s linear infinite}
.track:hover{animation-play-state:paused}
.track ul{display:flex;gap:12px;padding-right:12px}
.track li{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font:600 .95rem var(--font-display);color:var(--ink-2)}
.track li .ic{color:var(--accent)}
@keyframes slide{to{transform:translateX(-50%)}}

.section{padding:clamp(72px,10vw,140px) 0}
.alt{background:var(--bg-2)}
.sec-head{max-width:720px;margin-bottom:clamp(32px,5vw,56px)}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font:700 .78rem/1 var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.eyebrow::before{content:"";width:28px;height:2px;border-radius:2px;background:currentColor}
.h2{font-size:clamp(2rem,4.6vw,3.6rem);font-weight:700;letter-spacing:-.035em;margin:16px 0 14px}
.lead{color:var(--ink-2);font-size:clamp(1.02rem,1.5vw,1.2rem);max-width:60ch}

.rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.chip-btn{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font:600 .92rem var(--font-body);transition:background .2s,color .2s,border-color .2s,transform .2s}
.chip-btn:hover{border-color:var(--accent)}
.chip-btn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.grid-courses{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,262px),1fr));gap:22px}
.grid-courses>li{display:flex}
.card{position:relative;display:flex;flex-direction:column;width:100%;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);overflow:hidden;transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .4s var(--ease),box-shadow .4s,border-color .3s;will-change:transform}
.card:hover{box-shadow:var(--shadow)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--accent-hi) 16%,transparent),transparent 70%);opacity:0;transition:opacity .3s}
.card:hover::after{opacity:1}
.card.feat{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent),var(--shadow)}
.art{position:relative;aspect-ratio:16/10;overflow:hidden;color:var(--accent-ink)}
.art.a0{background:linear-gradient(135deg,var(--accent),var(--violet))}
.art.a1{background:linear-gradient(135deg,var(--violet),var(--accent-hi))}
.art.a2{background:linear-gradient(135deg,var(--accent-deep),var(--cyan))}
.art.a3{background:linear-gradient(135deg,var(--ink),var(--accent))}
.art-no{position:absolute;right:14px;bottom:-14px;font:700 6.4rem/1 var(--font-display);letter-spacing:-.06em;opacity:.16}
.art-shape{position:absolute;border-radius:22px;border:1px solid color-mix(in srgb,var(--accent-ink) 40%,transparent);background:color-mix(in srgb,var(--accent-ink) 14%,transparent);backdrop-filter:blur(4px);transform:rotate(var(--r,12deg));animation:bob 7s ease-in-out infinite}
.art-shape.s1{width:84px;height:84px;left:12%;top:18%;--r:-14deg;display:grid;place-items:center;font-size:2.1rem}
.art-shape.s2{width:56px;height:56px;left:38%;top:52%;--r:18deg;animation-delay:-2s}
.art-shape.s3{width:110px;height:110px;right:-16px;top:-22px;--r:30deg;animation-delay:-4s}
.art-ic{position:absolute;left:12%;top:18%;width:84px;height:84px;display:grid;place-items:center;font-size:2rem}
.art-badge{position:absolute;left:14px;top:14px;padding:4px 12px;border-radius:999px;background:var(--surface);color:var(--ink);font:700 .74rem var(--font-body);letter-spacing:.04em;text-transform:uppercase}
.card-body{display:flex;flex-direction:column;flex:1;padding:22px;gap:10px}
.lvl{display:flex;align-items:center;justify-content:space-between;gap:8px;font:700 .74rem var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.tag-sample{padding:2px 9px;border-radius:999px;border:1px dashed var(--line-2);font:600 .68rem var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.card h3{font-size:1.3rem;font-weight:600}
.card .blurb{color:var(--ink-2);font-size:.95rem;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-3);font-size:.88rem;font-weight:500}
.meta li{display:inline-flex;align-items:center;gap:6px}
.price-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 10px;margin-top:6px}
.price{font:700 1.85rem/1 var(--font-display);letter-spacing:-.03em}
.was{color:var(--ink-3);text-decoration:line-through;font-size:.95rem}
.save{padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);font:700 .78rem var(--font-body)}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.card-actions .btn{padding:0 12px}
.empty{padding:48px 24px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--radius-lg);color:var(--ink-2);background:var(--surface)}
.empty .btn{margin-top:16px}

.overlay{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--ink) 58%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.dialog{width:min(100%,780px);max-height:min(92svh,880px);overflow:auto;background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);animation:pop .45s var(--ease);overscroll-behavior:contain}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.97)}}
.dialog:focus{outline:none}
.dlg-head{position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:24px 28px 18px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.dlg-head h3{font-size:clamp(1.4rem,3vw,1.9rem)}
.x-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--surface);flex:none;transition:background .2s}
.x-btn:hover{background:var(--accent-soft)}
.dlg-body{padding:24px 28px 8px;display:grid;gap:26px}
.outcomes{display:grid;gap:10px}
.outcomes li{display:flex;gap:10px;color:var(--ink-2)}
.outcomes .ic{color:var(--ok);margin-top:.28em}
.dlg-body h4{font-size:1.05rem;margin-bottom:12px}
.mods{display:grid;gap:8px}
.mods details{border:1px solid var(--line);border-radius:14px;background:var(--surface-2)}
.mods summary{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:0 18px;cursor:pointer;font:600 .98rem var(--font-display);list-style:none}
.mods summary::-webkit-details-marker{display:none}
.mods summary .ic{transition:transform .3s var(--ease)}
.mods details[open] summary .ic{transform:rotate(90deg)}
.mods ul{padding:0 18px 16px 34px;display:grid;gap:6px;color:var(--ink-2);font-size:.94rem;list-style:disc}
.dlg-foot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding:18px 28px;background:var(--surface);border-top:1px solid var(--line);margin-top:18px}
.dlg-foot .acts{display:flex;flex-wrap:wrap;gap:10px}

.road-wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(32px,6vw,72px);align-items:start}
.road-wrap .sec-head{position:sticky;top:calc(var(--nav-h) + 32px);margin-bottom:0}
.road{position:relative}
.road-list{display:grid;gap:24px}
.road-line{position:absolute;left:23px;top:24px;bottom:24px;width:2px;background:var(--line-2);border-radius:2px;overflow:hidden}
.road-fill{position:absolute;inset:0;background:linear-gradient(var(--accent),var(--violet));transform-origin:top;transform:scaleY(var(--p,0))}

.step-card .when{font:700 .74rem var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.step-card h3{font-size:1.2rem;margin:6px 0 6px}

.portrait .mono{font:700 clamp(5rem,16vw,9rem)/1 var(--font-display);letter-spacing:-.06em;color:var(--accent-ink)}

.portrait .ring.r2{inset:16px -16px -16px 16px;border-color:var(--violet);opacity:.3;animation-delay:-3s}
.portrait .stamp{position:absolute;right:-14px;bottom:28px;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font:600 .86rem var(--font-body);transform:translateZ(60px)}

.checks li{display:flex;gap:10px;align-items:flex-start;color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:16px;margin-bottom:28px}
.stat{padding:26px 24px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm)}

.sample-note{font-size:.84rem;color:var(--ink-3);margin-bottom:28px}

.quotes>li{display:flex}
.quote{display:flex;flex-direction:column;gap:18px;width:100%;padding:26px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .4s var(--ease),box-shadow .4s}

.who small{color:var(--ink-3);font-size:.84rem}

.contact{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(32px,6vw,72px);align-items:start}
.direct{display:grid;gap:12px;margin-top:28px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field label{display:block;font:600 .9rem var(--font-body);margin-bottom:6px}

.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.field [aria-invalid="true"]{border-color:var(--err)}
.field .e{display:block;margin-top:6px;color:var(--err);font-size:.86rem;font-weight:500}

.submit-row small{color:var(--ink-3);font-size:.84rem;flex:1;min-width:180px}

.faq{max-width:860px;display:grid;gap:12px}

.faq-item.open .faq-a{grid-template-rows:1fr;visibility:visible}
.faq-a>div{overflow:hidden}
.faq-a p{padding:0 22px 22px;color:var(--ink-2)}

}

  .h1 .w>span{transform:none}
  .step-card{opacity:1;transform:none}
  .track{animation:none;overflow-x:auto}
}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js" integrity="sha384-toVdrLSMaw7Y55MowcKqkmFL/Ek6Sky62NOk0b5sDDZBu2wcoPyyQUt9unDVjXhL" crossorigin="anonymous"></script>
<script type="module">
(function () {
  if (!(window.React && window.ReactDOM && window.htm)) {
    const p = document.querySelector('#root p:last-child');
    if (p) p.textContent = 'The page could not load its scripts. Please check your connection and reload.';
    return;
  }

  const DATA = JSON.parse(document.getElementById('site-data').textContent);
  const S = DATA.site;
  const R = window.React;
  const { useState, useEffect, useRef, useCallback, Fragment } = R;
  const html = window.htm.bind(R.createElement);

  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finePointer = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const ptr = { x: 0, y: 0 };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const safeUrl = (u) => {
    if (!u) return '';
    try { const x = new URL(u, location.href); return x.protocol === 'https:' ? x.href : ''; } catch (e) { return ''; }
  };
  const safeMail = (m) => (/^[^\s@<>"]+@[^\s@<>"]+\.[^\s@<>"]+$/.test(m || '') ? m : '');
  const waLink = (text) => {
    const d = String(S.whatsapp || '').replace(/\D/g, '');
    return d ? 'https://wa.me/' + d + '?text=' + encodeURIComponent(text) : '';
  };
  const money = (n) => {
    try { return new Intl.NumberFormat(S.locale || 'en-US', { style: 'currency', currency: S.currency || 'USD', maximumFractionDigits: 0 }).format(n); }
    catch (e) { return '$' + n; }
  };
  const scrollToId = (id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
  };
  const initials = (name) => String(name || '').split(/\s+/).filter(Boolean).map((w) => w[0]).join('').slice(0, 2).toUpperCase();

  addEventListener('pointermove', (e) => {
    ptr.x = (e.clientX / innerWidth) * 2 - 1;
    ptr.y = -((e.clientY / innerHeight) * 2 - 1);
  }, { passive: true });

  const io = 'IntersectionObserver' in window
    ? new IntersectionObserver((entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' })
    : null;

  function initTilt() {
    if (reduced || !finePointer) return;
    let cur = null, raf = 0, ev = null;
    const reset = (el) => {
      if (!el) return;
      el.style.setProperty('--rx', '0deg');
      el.style.setProperty('--ry', '0deg');
    };
    const apply = () => {
      raf = 0;
      if (!cur || !ev) return;
      const r = cur.getBoundingClientRect();
      const x = (ev.clientX - r.left) / r.width;
      const y = (ev.clientY - r.top) / r.height;
      const max = parseFloat(cur.dataset.tilt) || 8;
      cur.style.setProperty('--ry', ((x - 0.5) * max * 2).toFixed(2) + 'deg');
      cur.style.setProperty('--rx', ((0.5 - y) * max * 2).toFixed(2) + 'deg');
      cur.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
      cur.style.setProperty('--my', (y * 100).toFixed(1) + '%');
    };
    document.addEventListener('pointermove', (e) => {
      const t = e.target.closest ? e.target.closest('[data-tilt]') : null;
      if (t !== cur) { reset(cur); cur = t; }
      ev = e;
      if (cur && !raf) raf = requestAnimationFrame(apply);
    }, { passive: true });
    document.documentElement.addEventListener('mouseleave', () => { reset(cur); cur = null; });
  }

  async function initField(canvas) {
    if (!canvas) return;
    let T;
    try { T = await import('three'); } catch (e) { return; }
    T.ColorManagement.enabled = false;
    let renderer;
    try {
      renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'low-power' });
    } catch (e) { return; }

    const host = canvas.parentElement;
    const cs = getComputedStyle(document.documentElement);
    const tok = (n) => new T.Color(cs.getPropertyValue(n).trim());
    const palette = [tok('--accent'), tok('--accent'), tok('--accent-hi'), tok('--violet'), tok('--cyan')];
    const mobile = innerWidth < 768;
    const N = mobile ? 64 : 128;
    const LINK = mobile ? 2.9 : 2.6;
    const LINK2 = LINK * LINK;
    const MAXSEG = N * 5;
    const BX = 9, BY = 5.2, BZ = 4.5;

    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(50, 1, 0.1, 60);
    camera.position.set(0, 0, 14);
    const group = new T.Group();
    scene.add(group);

    const pos = new Float32Array(N * 3), vel = new Float32Array(N * 3);
    const size = new Float32Array(N), col = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      pos[i * 3] = (Math.random() * 2 - 1) * BX;
      pos[i * 3 + 1] = (Math.random() * 2 - 1) * BY;
      pos[i * 3 + 2] = (Math.random() * 2 - 1) * BZ;
      vel[i * 3] = (Math.random() - 0.5) * 0.5;
      vel[i * 3 + 1] = (Math.random() - 0.5) * 0.5;
      vel[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
      size[i] = Math.random() < 0.1 ? 9 + Math.random() * 4 : 2.2 + Math.random() * 3;
      const c = palette[(Math.random() * palette.length) | 0];
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }

    const pg = new T.BufferGeometry();
    const posAttr = new T.BufferAttribute(pos, 3);
    posAttr.setUsage(T.DynamicDrawUsage);
    pg.setAttribute('position', posAttr);
    pg.setAttribute('aSize', new T.BufferAttribute(size, 1));
    pg.setAttribute('aColor', new T.BufferAttribute(col, 3));
    const pm = new T.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { uPx: { value: 1 } },
      vertexShader: 'attribute float aSize;attribute vec3 aColor;uniform float uPx;varying vec3 vC;varying float vA;void main(){vC=aColor;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=aSize*uPx*(24.0/-mv.z);vA=clamp(1.25-(-mv.z-9.0)/14.0,0.3,1.0);gl_Position=projectionMatrix*mv;}',
      fragmentShader: 'varying vec3 vC;varying float vA;void main(){float d=length(gl_PointCoord-vec2(0.5));if(d>0.5)discard;float halo=smoothstep(0.5,0.2,d)*0.28;float core=smoothstep(0.2,0.12,d)*0.95;gl_FragColor=vec4(vC,(halo+core)*vA);}'
    });
    const pts = new T.Points(pg, pm);
    pts.frustumCulled = false;

    const lpos = new Float32Array(MAXSEG * 6), lalpha = new Float32Array(MAXSEG * 2);
    const lg = new T.BufferGeometry();
    const lposAttr = new T.BufferAttribute(lpos, 3);
    const lalphaAttr = new T.BufferAttribute(lalpha, 1);
    lposAttr.setUsage(T.DynamicDrawUsage);
    lalphaAttr.setUsage(T.DynamicDrawUsage);
    lg.setAttribute('position', lposAttr);
    lg.setAttribute('aAlpha', lalphaAttr);
    lg.setDrawRange(0, 0);
    const lm = new T.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { uColor: { value: tok('--accent') } },
      vertexShader: 'attribute float aAlpha;varying float vA;void main(){vA=aAlpha;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
      fragmentShader: 'uniform vec3 uColor;varying float vA;void main(){gl_FragColor=vec4(uColor,vA);}'
    });
    const ls = new T.LineSegments(lg, lm);
    ls.frustumCulled = false;
    group.add(pts, ls);

    const sim = (dt, t) => {
      const k = dt * 60;
      const half = Math.tan((25 * Math.PI) / 180) * 14;
      const sc = group.scale.x || 1;
      const tx = (ptr.x * half * camera.aspect - group.position.x) / sc;
      const ty = (ptr.y * half) / sc;
      for (let i = 0; i < N; i++) {
        const o = i * 3;
        pos[o] += vel[o] * dt;
        pos[o + 1] += vel[o + 1] * dt;
        pos[o + 2] += vel[o + 2] * dt;
        if (pos[o] > BX || pos[o] < -BX) { vel[o] = -vel[o]; pos[o] = clamp(pos[o], -BX, BX); }
        if (pos[o + 1] > BY || pos[o + 1] < -BY) { vel[o + 1] = -vel[o + 1]; pos[o + 1] = clamp(pos[o + 1], -BY, BY); }
        if (pos[o + 2] > BZ || pos[o + 2] < -BZ) { vel[o + 2] = -vel[o + 2]; pos[o + 2] = clamp(pos[o + 2], -BZ, BZ); }
        if (finePointer && !reduced) {
          const dx = pos[o] - tx, dy = pos[o + 1] - ty;
          const d2 = dx * dx + dy * dy;
          if (d2 < 5.8 && d2 > 0.0001) {
            const d = Math.sqrt(d2);
            const f = (1 - d2 / 5.8) * 0.07 * k;
            pos[o] += (dx / d) * f;
            pos[o + 1] += (dy / d) * f;
          }
        }
      }
      let seg = 0;
      for (let i = 0; i < N && seg < MAXSEG; i++) {
        const a = i * 3;
        for (let j = i + 1; j < N && seg < MAXSEG; j++) {
          const b = j * 3;
          const dx = pos[a] - pos[b], dy = pos[a + 1] - pos[b + 1], dz = pos[a + 2] - pos[b + 2];
          const d2 = dx * dx + dy * dy + dz * dz;
          if (d2 < LINK2) {
            const al = (1 - Math.sqrt(d2) / LINK) * 0.38;
            const s = seg * 6;
            lpos[s] = pos[a]; lpos[s + 1] = pos[a + 1]; lpos[s + 2] = pos[a + 2];
            lpos[s + 3] = pos[b]; lpos[s + 4] = pos[b + 1]; lpos[s + 5] = pos[b + 2];
            lalpha[seg * 2] = al; lalpha[seg * 2 + 1] = al;
            seg++;
          }
        }
      }
      posAttr.needsUpdate = true;
      lposAttr.needsUpdate = true;
      lalphaAttr.needsUpdate = true;
      lg.setDrawRange(0, seg * 2);

      const sp = clamp(scrollY / (host.offsetHeight || 1), 0, 1.2);
      const ease = Math.min(1, dt * 2.5);
      const ry = ptr.x * 0.22 + sp * 0.7 + Math.sin(t * 0.1) * 0.15;
      const rx = -ptr.y * 0.12;
      group.rotation.y += (ry - group.rotation.y) * ease;
      group.rotation.x += (rx - group.rotation.x) * ease;
      group.position.y = sp * 1.5;
      camera.position.z = 14 + sp * 3;
    };

    const resize = () => {
      const w = host.clientWidth, h = host.clientHeight;
      if (!w || !h) return;
      const dpr = Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 2);
      renderer.setPixelRatio(dpr);
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      pm.uniforms.uPx.value = dpr;
      const a = camera.aspect;
      group.scale.setScalar(a < 0.9 ? 0.62 : a < 1.3 ? 0.85 : 1);
      group.position.x = a > 1.3 ? 3.2 : 0;
      renderer.render(scene, camera);
    };

    let raf = 0, vis = true, last = performance.now();
    const frame = (now) => {
      raf = 0;
      if (!vis || document.hidden) return;
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      sim(dt, now / 1000);
      renderer.render(scene, camera);
      raf = requestAnimationFrame(frame);
    };
    const start = () => {
      if (raf || reduced) return;
      last = performance.now();
      raf = requestAnimationFrame(frame);
    };
    const stop = () => { cancelAnimationFrame(raf); raf = 0; };

    canvas.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      stop();
      host.classList.remove('field-on');
    });

    sim(0, 0);
    resize();
    host.classList.add('field-on');
    if ('ResizeObserver' in window) new ResizeObserver(resize).observe(host);
    else addEventListener('resize', resize);
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(([e]) => { vis = e.isIntersecting; if (vis) start(); else stop(); }).observe(host);
    } else start();
    document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); else if (vis) start(); });
  }

  const Ic = ({ n, cls = '' }) => html`<svg className=${'ic ' + cls} aria-hidden="true" focusable="false"><use href=${'#i-' + n}/></svg>`;

  function Rv({ as = 'div', delay = 0, className = '', children, ...p }) {
    const ref = useRef(null);
    useEffect(() => {
      const el = ref.current;
      if (!el) return;
      if (!io || reduced) { el.classList.add('in'); return; }
      io.observe(el);
      return () => io.unobserve(el);
    }, []);
    return R.createElement(as, { ref, className: 'rv ' + className, style: { '--d': delay + 'ms' }, ...p }, children);
  }

  function Count({ to, suffix = '', decimals = 0 }) {
    const ref = useRef(null);
    const [v, setV] = useState(reduced ? to : 0);
    useEffect(() => {
      const el = ref.current;
      if (reduced || !el || !('IntersectionObserver' in window)) { setV(to); return; }
      let raf = 0, t0 = 0;
      const run = (t) => {
        t0 = t0 || t;
        const p = clamp((t - t0) / 1400, 0, 1);
        setV(to * (1 - Math.pow(1 - p, 3)));
        if (p < 1) raf = requestAnimationFrame(run);
      };
      const o = new IntersectionObserver(([e]) => {
        if (e.isIntersecting) { o.disconnect(); raf = requestAnimationFrame(run); }
      }, { threshold: 0.4 });
      o.observe(el);
      return () => { o.disconnect(); cancelAnimationFrame(raf); };
    }, [to]);
    const fmt = (n) => (decimals ? n.toFixed(decimals) : Math.round(n).toLocaleString(S.locale || 'en-US'));
    return html`<span ref=${ref} className="num"><span aria-hidden="true">${fmt(v)}${suffix}</span><span className="sr">${fmt(to)}${suffix}</span></span>`;
  }

  function Words({ text, from = 0, cls = '' }) {
    return text.split(' ').map((w, i) => html`<${Fragment} key=${i}><span className="w"><span className=${cls} style=${{ '--i': from + i }}>${w}</span></span>${' '}<//>`);
  }

  function Head({ c, id }) {
    return html`<${Rv} className="sec-head"><span className="eyebrow">${c.eyebrow}</span><h2 className="h2" id=${id}>${c.title}</h2>${c.lead ? html`<p className="lead">${c.lead}</p>` : null}<//>`;
  }

  function Nav() {
    const [solid, setSolid] = useState(false);
    const [open, setOpen] = useState(false);
    useEffect(() => {
      const f = () => setSolid(scrollY > 12);
      f();
      addEventListener('scroll', f, { passive: true });
      return () => removeEventListener('scroll', f);
    }, []);
    useEffect(() => {
      if (!open) return;
      const k = (e) => { if (e.key === 'Escape') setOpen(false); };
      addEventListener('keydown', k);
      return () => removeEventListener('keydown', k);
    }, [open]);
    const links = [['courses', 'Courses'], ['roadmap', 'Roadmap'], ['about', 'About'], ['results', 'Results'], ['faq', 'FAQ']];
    return html`<header className=${'nav' + (solid || open ? ' solid' : '')}>
      <div className="wrap nav-in">
        <a className="logo" href="#top" aria-label=${S.brand + ' home'}><span className="logo-mark"><${Ic} n="spark"/></span>${S.brand}</a>
        <nav aria-label="Primary"><ul className="nav-links">${links.map(([id, t]) => html`<li key=${id}><a href=${'#' + id}>${t}</a></li>`)}</ul></nav>
        <div className="nav-right">
          <a className="btn btn-primary btn-sm" href="#contact">Enroll now</a>
          <button type="button" className="burger" aria-label=${open ? 'Close menu' : 'Open menu'} aria-expanded=${open} aria-controls="mnav" onClick=${() => setOpen(!open)}><${Ic} n=${open ? 'close' : 'menu'}/></button>
        </div>
      </div>
      <div className="mnav" id="mnav" hidden=${!open}>
        ${links.map(([id, t]) => html`<a key=${id} href=${'#' + id} onClick=${() => setOpen(false)}>${t}</a>`)}
        <a className="btn btn-primary" href="#contact" onClick=${() => setOpen(false)}>Enroll now</a>
      </div>
    </header>`;
  }

  function Demo({ items }) {
    const [i, setI] = useState(0);
    const [n, setN] = useState(reduced ? items[0].q.length : 0);
    const [phase, setPhase] = useState(reduced ? 'show' : 'type');
    useEffect(() => {
      if (reduced) return;
      let t;
      if (phase === 'type') {
        if (n < items[i].q.length) t = setTimeout(() => setN(n + 1), 32);
        else t = setTimeout(() => setPhase('show'), 380);
      } else {
        t = setTimeout(() => { setPhase('type'); setN(0); setI((i + 1) % items.length); }, 4600);
      }
      return () => clearTimeout(t);
    }, [phase, n, i]);
    const cur = items[i];
    return html`<${Fragment}>
      <div className="bubble">${cur.q.slice(0, n)}${phase === 'type' ? html`<span className="caret"></span>` : null}</div>
      <div className="reply" key=${i + phase}>${phase === 'show' ? cur.a.map((l, k) => html`<div className="ln" key=${k} style=${{ '--k': k }}><${Ic} n="check"/><span>${l}</span></div>`) : null}</div>
    <//>`;
  }

  function Stage({ items }) {
    const ref = useRef(null);
    useEffect(() => {
      const el = ref.current;
      const host = el && el.closest('.hero');
      if (!host || reduced || !finePointer) return;
      let raf = 0;
      const mv = (e) => {
        const r = host.getBoundingClientRect();
        const x = (e.clientX - r.left) / r.width - 0.5;
        const y = (e.clientY - r.top) / r.height - 0.5;
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => {
          el.style.setProperty('--ry', (-14 + x * 16).toFixed(1) + 'deg');
          el.style.setProperty('--rx', (6 - y * 12).toFixed(1) + 'deg');
        });
      };
      host.addEventListener('pointermove', mv, { passive: true });
      return () => host.removeEventListener('pointermove', mv);
    }, []);
    return html`<div className="stage" aria-hidden="true">
      <div className="deck" ref=${ref}>
        <div className="dcard dc-main"><div className="win-dots"><i></i><i></i><i></i></div><${Demo} items=${items}/></div>
        <div className="dcard dc-flow">
          <p className="flow-title">Agent flow</p>
          <svg className="flow-svg" viewBox="0 0 200 70" focusable="false">
            <path className="flow-line" d="M30 36 C58 6 72 6 96 36"/>
            <path className="flow-line" d="M104 36 C128 66 148 66 172 36"/>
            <circle className="flow-node" cx="24" cy="36" r="9"/>
            <circle className="flow-node hot" cx="100" cy="36" r="9"/>
            <circle className="flow-node" cx="178" cy="36" r="9"/>
          </svg>
        </div>
        <div className="dcard dc-chip"><${Ic} n="layers"/>Prompt library</div>
        <div className="dcard dc-chip2"><${Ic} n="shield"/>Safe by design</div>
      </div>
    </div>`;
  }

  function Hero() {
    const H = DATA.hero;
    const wa = waLink('Hi ' + S.name + ', I would like to know more about your AI courses.');
    return html`<section className="hero" id="top" aria-labelledby="h1">
      <div className="hero-bg" aria-hidden="true"></div>
      <div className="hero-dots" aria-hidden="true"></div>
      <canvas id="field" aria-hidden="true"></canvas>
      <div className="hero-scrim" aria-hidden="true"></div>
      <div className="wrap hero-grid">
        <div>
          <span className="pill"><i className="dot"></i>${H.pill}</span>
          <h1 className="h1" id="h1">${Words({ text: H.lead })}${Words({ text: H.accent, from: H.lead.split(' ').length, cls: 'grad' })}</h1>
          <p className="hero-sub">${H.sub}</p>
          <div className="hero-cta">
            <a className="btn btn-primary" href="#courses">Explore courses <${Ic} n="arrow" cls="ic-go"/></a>
            ${wa ? html`<a className="btn btn-ghost" href=${wa} target="_blank" rel="noopener noreferrer"><${Ic} n="chat"/>Chat on WhatsApp</a>` : null}
          </div>
          <ul className="facts">${H.facts.map((f) => html`<li key=${f}><${Ic} n="check"/>${f}</li>`)}</ul>
        </div>
        <${Stage} items=${H.prompts}/>
      </div>
    </section>`;
  }

  function Modal({ c, onClose, onEnroll }) {
    const ref = useRef(null);
    useEffect(() => {
      const prev = document.activeElement;
      const body = document.body;
      const old = body.style.overflow;
      body.style.overflow = 'hidden';
      ref.current.focus();
      const key = (e) => {
        if (e.key === 'Escape') { e.stopPropagation(); onClose(); return; }
        if (e.key !== 'Tab') return;
        const f = [...ref.current.querySelectorAll('a[href],button:not([disabled]),summary')].filter((x) => x.offsetParent !== null);
        if (!f.length) return;
        const a = f[0], z = f[f.length - 1];
        if (e.shiftKey && (document.activeElement === a || document.activeElement === ref.current)) { e.preventDefault(); z.focus(); }
        else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
      };
      document.addEventListener('keydown', key);
      return () => {
        document.removeEventListener('keydown', key);
        body.style.overflow = old;
        if (prev && prev.focus) prev.focus({ preventScroll: true });
      };
    }, []);
    const pay = safeUrl(c.paymentLink);
    const wa = waLink('Hi ' + S.name + ', I am interested in "' + c.title + '". Can you share more details?');
    return html`<div className="overlay" onMouseDown=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t" tabIndex="-1" ref=${ref}>

      const el = ref.current;
      if (!el) return;
      let raf = 0;
      const f = () => {
        raf = 0;
        const r = el.getBoundingClientRect();
        const p = clamp((innerHeight * 0.62 - r.top) / r.height, 0, 1);
        el.style.setProperty('--p', p.toFixed(3));
        setOn(reduced ? items.length : Math.min(items.length, Math.ceil(p * items.length) + (r.top < innerHeight * 0.75 ? 1 : 0)));
      };
      const sched = () => { if (!raf) raf = requestAnimationFrame(f); };
      f();
      addEventListener('scroll', sched, { passive: true });
      addEventListener('resize', sched);
      return () => { removeEventListener('scroll', sched); removeEventListener('resize', sched); cancelAnimationFrame(raf); };
    }, []);
    return html`<section className="section" id="roadmap" aria-labelledby="road-h">
      <div className="wrap road-wrap">
        <${Head} c=${DATA.copy.roadmap} id="road-h"/>

  function Contact({ picked, setPicked }) {
    const blank = { name: '', email: '', whatsapp: '', message: '', company: '' };
    const [f, setF] = useState(blank);
    const [err, setErr] = useState({});
    const [st, setSt] = useState('idle');
    const [note, setNote] = useState('');
    const set = (k) => (e) => setF((p) => ({ ...p, [k]: e.target.value }));
    const wa = waLink('Hi ' + S.name + ', I have a question about your AI courses.');
    const mail = safeMail(S.email);

    const validate = () => {
      const x = {};
      if (f.name.trim().length < 2) x.name = 'Please enter your name.';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(f.email.trim())) x.email = 'Enter a valid email address.';
      if (f.whatsapp && !/^\+?[0-9\s()-]{7,20}$/.test(f.whatsapp.trim())) x.whatsapp = 'Use digits with country code, e.g. +1 202 555 0143.';
      return x;
    };

    const submit = async (e) => {
      e.preventDefault();
      if (st === 'sending') return;
      const x = validate();
      setErr(x);
      if (Object.keys(x).length) {
        requestAnimationFrame(() => { const b = document.querySelector('#enq [aria-invalid="true"]'); if (b) b.focus(); });
        return;
      }
      if (f.company) { setSt('success'); return; }
      if (!navigator.onLine) { setNote('You are offline. Reconnect and try again, or use the WhatsApp button.'); setSt('offline'); return; }
      if (Date.now() - (parseInt(store.get('enq_ts'), 10) || 0) < 30000) { setNote('Please wait a few seconds before sending again.'); setSt('error'); return; }
      const course = DATA.courses.find((c) => c.id === picked);
      const payload = {
        name: f.name.trim().slice(0, 80),
        email: f.email.trim().slice(0, 120),
        whatsapp: f.whatsapp.trim().slice(0, 24),
        course: course ? course.title : 'General enquiry',
        message: f.message.trim().slice(0, 600)
      };
      const ep = safeUrl(S.formEndpoint);
      if (!ep) {
        const text = 'Hi ' + S.name + ', I am ' + payload.name + ' (' + payload.email + '). Course: ' + payload.course + '. ' + payload.message;
        const link = waLink(text);
        if (link) window.open(link, '_blank', 'noopener');
        else if (mail) location.href = 'mailto:' + mail + '?subject=' + encodeURIComponent('Course enquiry: ' + payload.course) + '&body=' + encodeURIComponent(text);
        setSt('fallback');
        return;
      }
      setSt('sending');
      setNote('');
      const ac = new AbortController();
      const to = setTimeout(() => ac.abort(), 8000);
      try {
        const r = await fetch(ep, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(payload), signal: ac.signal });
        if (!r.ok) throw new Error('status ' + r.status);
        store.set('enq_ts', String(Date.now()));
        setSt('success');
      } catch (er) {
        setNote(er && er.name === 'AbortError'
          ? 'The server took too long to answer. Please try again or use WhatsApp.'
          : 'Something went wrong and your message was not sent. Please try again or use WhatsApp.');
        setSt('error');
      } finally {
        clearTimeout(to);
      }
    };

    const again = () => { setF(blank); setErr({}); setNote(''); setSt('idle'); };
    const done = st === 'success' || st === 'fallback';

    return html`<section className="section alt" id="contact" aria-labelledby="contact-h">
      <div className="wrap contact">
        <${Rv}>
          <span className="eyebrow">${DATA.copy.contact.eyebrow}</span>
          <h2 className="h2" id="contact-h">${DATA.copy.contact.title}</h2>
          <p className="lead">${DATA.copy.contact.lead}</p>
          <div className="direct">
            ${wa ? html`<a href=${wa} target="_blank" rel="noopener noreferrer"><${Ic} n="chat"/><span>WhatsApp<small>Fastest reply</small></span></a>` : null}
            ${mail ? html`<a href=${'mailto:' + mail}><${Ic} n="mail"/><span>Email<small>${mail}</small></span></a>` : null}
          </div>
        <//>
        <${Rv} delay=${120}>
          <div className="form-card" id="enq">
            ${done
              ? html`<div className="done" role="status">
                  <span className="tick"><${Ic} n="check"/></span>
                  <h3>${st === 'success' ? 'Message sent' : 'Almost done'}</h3>
                  <p>${st === 'success' ? 'Thank you. I will reply to your email soon.' : 'Finish sending your message in the WhatsApp or email window that just opened.'}</p>
                  <button type="button" className="btn btn-ghost btn-sm" onClick=${again}>Send another message</button>
                </div>`
              : html`<form onSubmit=${submit} noValidate>
                  <h3>Send a message</h3>
                  <p>Tell me what you want to learn. Every enquiry gets a personal reply.</p>
                  <div className="fields">
                    <div className="two">
                      <div className="field">
                        <label htmlFor="f-name">Name</label>
                        <input id="f-name" name="name" autoComplete="name" maxLength="80" required value=${f.name} onChange=${set('name')} aria-invalid=${err.name ? 'true' : 'false'} aria-describedby=${err.name ? 'e-name' : undefined}/>
                        ${err.name ? html`<span className="e" id="e-name">${err.name}</span>` : null}
                      </div>
                      <div className="field">
                        <label htmlFor="f-email">Email</label>
                        <input id="f-email" name="email" type="email" autoComplete="email" maxLength="120" required value=${f.email} onChange=${set('email')} aria-invalid=${err.email ? 'true' : 'false'} aria-describedby=${err.email ? 'e-email' : undefined}/>
                        ${err.email ? html`<span className="e" id="e-email">${err.email}</span>` : null}
                      </div>
                    </div>
                    <div className="two">
                      <div className="field">
                        <label htmlFor="f-wa">WhatsApp <i>(optional)</i></label>
                        <input id="f-wa" name="whatsapp" type="tel" autoComplete="tel" maxLength="24" placeholder="+1 202 555 0143" value=${f.whatsapp} onChange=${set('whatsapp')} aria-invalid=${err.whatsapp ? 'true' : 'false'} aria-describedby=${err.whatsapp ? 'e-wa' : undefined}/>
                        ${err.whatsapp ? html`<span className="e" id="e-wa">${err.whatsapp}</span>` : null}
                      </div>
                      <div className="field">
                        <label htmlFor="f-course">Course</label>
                        <select id="f-course" name="course" value=${picked} onChange=${(e) => setPicked(e.target.value)}>
                          <option value="">General enquiry</option>
                          ${DATA.courses.map((c) => html`<option key=${c.id} value=${c.id}>${c.title}</option>`)}

                      </div>
                    </div>

                      <textarea id="f-msg" name="message" maxLength="600" value=${f.message} onChange=${set('message')}></textarea>
                    </div>
                    <div className="hp" aria-hidden="true"><label>Company<input name="company" tabIndex="-1" autoComplete="off" value=${f.company} onChange=${set('company')}/></label></div>
                    <div className="submit-row">
                      <button type="submit" className="btn btn-primary" disabled=${st === 'sending'}>${st === 'sending' ? html`<${Fragment}><span className="spin"></span>Sending<//>` : html`<${Fragment}>Send message <${Ic} n="arrow" cls="ic-go"/><//>`}</button>
                      <small>${S.formEndpoint ? 'Your details are used only to reply to you.' : 'Sends through WhatsApp or email.'}</small>
                    </div>
                    <p className=${'form-note' + (st === 'error' || st === 'offline' ? ' bad' : '')} role="status" aria-live="polite">${st === 'error' || st === 'offline' ? note : ''}</p>
                  </div>
                </form>`}
          </div>
        <//>
      </div>
    </section>`;
  }

  function App() {
    const [picked, setPicked] = useState('');
    const [openId, setOpenId] = useState(null);

    const enroll = useCallback((id) => {
      setPicked(id);
      setOpenId(null);
      requestAnimationFrame(() => requestAnimationFrame(() => scrollToId('contact')));
    }, []);
    const open = useCallback((id) => setOpenId(id), []);
    const close = useCallback(() => setOpenId(null), []);

    useEffect(() => {
      document.documentElement.classList.add('js');
      document.title = S.title;
      const setMeta = (sel, attr, val) => { const m = document.querySelector(sel); if (m) m.setAttribute(attr, val); };
      setMeta('meta[name="description"]', 'content', S.description);
      setMeta('meta[property="og:title"]', 'content', S.title);
      setMeta('meta[property="og:description"]', 'content', S.description);
      const canon = safeUrl(S.url);
      if (canon) setMeta('link[rel="canonical"]', 'href', canon);
      const ld = {
        '@context': 'https://schema.org',
        '@graph': [
          { '@type': 'Person', name: S.name, jobTitle: S.role, url: canon || undefined, sameAs: DATA.social.map((s) => safeUrl(s.url)).filter(Boolean) },
          { '@type': 'WebSite', name: S.brand, url: canon || undefined },
          { '@type': 'FAQPage', mainEntity: DATA.faq.map((q) => ({ '@type': 'Question', name: q.q, acceptedAnswer: { '@type': 'Answer', text: q.a } })) },
          ...DATA.courses.map((c) => ({
            '@type': 'Course', name: c.title, description: c.blurb,
            provider: { '@type': 'Person', name: S.name },
            offers: { '@type': 'Offer', price: c.price, priceCurrency: S.currency || 'USD', availability: 'https://schema.org/InStock', url: (canon || '') + '#courses' }
          }))
        ]
      };
      const s = document.createElement('script');
      s.type = 'application/ld+json';
      s.textContent = JSON.stringify(ld);
      document.head.appendChild(s);

      initTilt();
      initField(document.getElementById('field'));

      let raf = 0;
      const root = document.documentElement;
      const f = () => {
        raf = 0;
        const m = root.scrollHeight - innerHeight;
        root.style.setProperty('--sp', m > 0 ? clamp(scrollY / m, 0, 1).toFixed(4) : '0');
      };
      const sched = () => { if (!raf) raf = requestAnimationFrame(f); };
      f();
      addEventListener('scroll', sched, { passive: true });
      addEventListener('resize', sched);
      return () => { removeEventListener('scroll', sched); removeEventListener('resize', sched); s.remove(); };
    }, []);

    const course = DATA.courses.find((c) => c.id === openId);
    const wa = waLink('Hi ' + S.name + ', I would like to know more about your AI courses.');

    return html`<${Fragment}>
      <a className="skip" href="#main">Skip to content</a>
      <div className="progress" aria-hidden="true"></div>
      <${Nav}/>
      <main id="main">
        <${Hero}/>
        <${Marquee}/>
        <${Courses} onOpen=${open} onEnroll=${enroll}/>
        <${Roadmap}/>
        <${About}/>
        <${Results}/>
        <${Contact} picked=${picked} setPicked=${setPicked}/>
        <${Faq}/>
      </main>
      <${Footer}/>
      ${wa ? html`<a className="fab" href=${wa} target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp"><${Ic} n="chat"/></a>` : null}
      ${course ? html`<${Modal} c=${course} onClose=${close} onEnroll=${enroll}/>` : null}
      <${Offline}/>
    <//>`;
  }

  window.ReactDOM.createRoot(document.getElementById('root')).render(R.createElement(App));
})();
